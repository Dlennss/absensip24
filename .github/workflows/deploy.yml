name: Deploy Absensi P24

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: |
          npm ci
          npm run build

      - name: Upload backend source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/*"
          target: /tmp/absensip24-deploy/backend
          strip_components: 1
          rm: true

      - name: Upload frontend build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/build/*"
          target: /tmp/absensip24-deploy/frontend
          strip_components: 2
          rm: true

      - name: Install backend dependencies and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            BACKEND_DIR="${{ secrets.BACKEND_SOURCE_DIR }}"
            FRONTEND_DIR="${{ secrets.FRONTEND_RELEASE_DIR }}"

            sudo mkdir -p "$BACKEND_DIR" "$FRONTEND_DIR"
            sudo rsync -a --delete \
              --exclude ".env" \
              --exclude ".venv" \
              --exclude "uploads" \
              /tmp/absensip24-deploy/backend/ "$BACKEND_DIR"/
            sudo rsync -a --delete /tmp/absensip24-deploy/frontend/ "$FRONTEND_DIR"/

            cd "$BACKEND_DIR"
            sudo python3 -m venv .venv
            sudo .venv/bin/pip install --upgrade pip
            sudo .venv/bin/pip install -r requirements.txt
            sudo systemctl restart absensip24-backend
            sudo systemctl reload nginx
